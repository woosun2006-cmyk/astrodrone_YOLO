target: real
command:
  mode: observe
transport:
  # The external MAVLink router is the sole serial owner. It must open the
  # by-id Pixhawk device and fan out these loopback UDP endpoints.
  serial_endpoint: /dev/serial/by-id/REPLACE_WITH_PIXHAWK
  command_endpoint: udp:127.0.0.1:14550
  telemetry_endpoint: udp:127.0.0.1:14551
  gcs_telemetry_endpoint: udp:127.0.0.1:14553
  baud: 115200
  serial_owner: external-router
camera:
  source: jetson
flight:
  commands_enabled: false
  allow_mavlink_writes: false
  allow_vehicle_commands: false
  allow_arm: false
  allow_telemetry_configuration: false
  requires_allow_arm: true
  requires_confirm_real_flight: true
