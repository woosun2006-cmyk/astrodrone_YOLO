# HTTP server ports for each streaming/logging program.
# Kept distinct so all three can run on the Jetson at the same time.
camserver: 8000   # test_cam/camserver.py   -> http://192.168.0.197:8000/
fpslog: 8001      # test_cam/fpslog.py      -> http://192.168.0.197:8001/
yolo_live: 8002   # YOLO_MODEL/yolo_live.py -> http://192.168.0.197:8002/

# Adapter telemetry fan-out inputs. The SITL command owner uses TCP 5760;
# there is no canonical UDP control port.
telemetry_fanout: 14551       # target-distance read-only subscriber
gcs_telem_input: 14553        # GCS/Mission Planner read-only subscriber
health_telem_input: 14554     # C++ health_check read-only subscriber
target_observation: 15020     # FlightMissionApp target observation subscriber
gcs_target_observation: 15022 # telem_sender target observation subscriber

# gcs/sender telem_sender - JSON telemetry + interleaved XOR-FEC UDP stream
# (Jetson -> laptop GCS). Different range from the HTTP/MAVLink ports above
# so nothing collides.
gcs_telem: 15550
