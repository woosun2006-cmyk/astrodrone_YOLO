real:
  serial:
    address: /dev/ttyACM0
    baud: 115200
  proxy_udp:
    address: udp:127.0.0.1:14550

sitl:
  local_tcp:
    address: tcp:127.0.0.1:5762
  remote_udp:
    address: udp:0.0.0.0:14561
    note: Mission Planner SITL 에서 젯슨(192.168.0.196:14561)으로 MAVLink UDP 출력 추가

heartbeat_timeout: 20

# Target-approach guidance: target_distance.cpp computes a range to the
# YOLO-detected target and publishes it over loopback UDP; control.cpp
# consumes it and flies toward the target. See target_distance.cpp and
# control.cpp for how each value is used.
target_track:
  yolo_host: 127.0.0.1
  yolo_port: 8002          # must match setting/cam_sets.yaml's yolo_live port
  udp_port: 15020          # loopback link: target_distance.cpp -> control.cpp
  # Placeholder gain (m of real-world offset per pixel of image offset),
  # used to combine the target's pixel offset with altitude via Pythagoras.
  # NOT derived from a measured camera FOV/focal length (none on file) -
  # calibrate against a real target at a known distance/altitude before
  # trusting the computed range for actual flight.
  pixel_to_meter: 0.01
  target_stale_ms: 400     # ignore a YOLO detection older than this
  link_stale_ms: 500       # control.cpp hovers if no UDP packet this recent
  max_forward_speed: 0.5   # m/s cap, control.cpp's approach velocity
  max_lateral_speed: 0.5   # m/s cap, control.cpp's centering velocity
  stop_distance: 2.0       # m; forward speed -> 0 once inside this range
  approach_duration_sec: 60  # control.cpp lands automatically after this long
  # Two independent rates that used to share a single `cycle_ms` value even
  # though they pace two different processes with two different natural
  # rates:
  #   - sense_cycle_ms: target_distance.cpp's own loop (YOLO /target poll +
  #     ALTITUDE request interval). YOLO_MODEL/yolo_live.py's own comments
  #     put YOLOv5n inference at IMG_SIZE=320 around ~10 fps on this Jetson
  #     Nano, so this is paced to roughly match that, instead of polling
  #     faster than new detections can actually arrive.
  #   - control_cycle_ms: control.cpp's 1.range calc -> 2.velocity calc ->
  #     3.send-to-Pixhawk cycle period. Deliberately kept faster than
  #     sense_cycle_ms: ArduPilot's GUIDED mode wants a steady velocity
  #     setpoint stream, and control.cpp already re-sends the last valid
  #     target reading between fresh ones (see target_stale_ms/
  #     link_stale_ms below), so this can run faster than the sensing side
  #     without needing fresher data every tick.
  sense_cycle_ms: 100
  control_cycle_ms: 50
